name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      DATABASE_URL: sqlite:///db.sqlite3
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance_mvp/requirements.txt

      - name: Install dependencies
        run: pip install -r finance_mvp/requirements.txt

      - name: Lint — ruff
        run: ruff check finance_mvp/

      - name: Lint — black (check only)
        run: black --check finance_mvp/

      - name: Run tests
        working-directory: finance_mvp
        run: python manage.py test --verbosity=2

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint — ESLint
        working-directory: frontend
        run: npm run lint
